name: Build Inplay Radar APK

on:
  workflow_dispatch:
    inputs:
      release_action:
        description: "Yapılacak işlemi seç"
        required: true
        type: choice
        default: "Test et"
        options:
          - "Test et"
          - "Mevcut sürümü güncelle"
          - "Yeni sürümü yayınla"
      release_version:
        description: "Yalnızca yeni sürüm yayınlarken gir (ör. 2.1.0)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: inplay-radar-manual-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Prepare version and validate selection
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTION: ${{ inputs.release_action }}
          INPUT_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          CURRENT_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"

          if [[ -z "$CURRENT_VERSION" || -z "$CURRENT_CODE" ]]; then
            echo "Could not read versionName/versionCode from app/build.gradle.kts."
            exit 1
          fi

          case "$RELEASE_ACTION" in
            "Test et")
              RELEASE_VERSION="$CURRENT_VERSION"
              NEXT_CODE="$CURRENT_CODE"
              ;;
            "Mevcut sürümü güncelle")
              RELEASE_VERSION="$CURRENT_VERSION"
              NEXT_CODE="$CURRENT_CODE"
              gh release view "v$RELEASE_VERSION" >/dev/null
              ;;
            "Yeni sürümü yayınla")
              if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Geçerli bir sürüm numarası gir. Örnek: 2.1.0"
                exit 1
              fi

              RELEASE_VERSION="$INPUT_VERSION"

              if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
                echo "v$RELEASE_VERSION Release zaten mevcut."
                exit 1
              fi
              if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
                echo "v$RELEASE_VERSION Git etiketi zaten mevcut."
                exit 1
              fi

              if [[ "$RELEASE_VERSION" == "$CURRENT_VERSION" ]]; then
                NEXT_CODE="$CURRENT_CODE"
              else
                NEXT_CODE="$((CURRENT_CODE + 1))"
              fi

              python3 -c 'import sys; from pathlib import Path; release_version, next_code = sys.argv[1], sys.argv[2]; path = Path("app/build.gradle.kts"); lines = path.read_text().splitlines(); code_indexes = [i for i, line in enumerate(lines) if line.strip().startswith("versionCode =")]; name_indexes = [i for i, line in enumerate(lines) if line.strip().startswith("versionName =")]; assert len(code_indexes) == 1 and len(name_indexes) == 1, "Expected exactly one versionCode and versionName."; ci, ni = code_indexes[0], name_indexes[0]; ci_indent = lines[ci][:len(lines[ci]) - len(lines[ci].lstrip())]; ni_indent = lines[ni][:len(lines[ni]) - len(lines[ni].lstrip())]; lines[ci] = ci_indent + "versionCode = " + next_code; lines[ni] = ni_indent + "versionName = " + chr(34) + release_version + chr(34); path.write_text(chr(10).join(lines) + chr(10))' "$RELEASE_VERSION" "$NEXT_CODE"

              if ! git diff --quiet -- app/build.gradle.kts; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add app/build.gradle.kts
                git commit -m "Set app version to ${RELEASE_VERSION} (versionCode ${NEXT_CODE})"
                git push origin HEAD:main
              fi
              ;;
            *)
              echo "Bilinmeyen işlem: $RELEASE_ACTION"
              exit 1
              ;;
          esac

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$NEXT_CODE" >> "$GITHUB_OUTPUT"
          echo "Derlenecek sürüm: $RELEASE_VERSION (versionCode $NEXT_CODE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: |
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            sdkmanager --install "platforms;android-35" "build-tools;36.0.0"
          fi

      - name: Restore persistent signing key
        env:
          INPLAY_KEYSTORE_BASE64: ${{ secrets.INPLAY_KEYSTORE_BASE64 }}
        run: |
          echo "$INPLAY_KEYSTORE_BASE64" | base64 --decode > app/inplay-release.keystore
          test -s app/inplay-release.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build signed APK
        env:
          INPLAY_KEYSTORE_PASSWORD: ${{ secrets.INPLAY_KEYSTORE_PASSWORD }}
          INPLAY_KEY_ALIAS: ${{ secrets.INPLAY_KEY_ALIAS }}
          INPLAY_KEY_PASSWORD: ${{ secrets.INPLAY_KEY_PASSWORD }}
        run: gradle assembleDebug --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Inplay-Radar-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Update existing Release
        if: inputs.release_action == 'Mevcut sürümü güncelle'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.prepare.outputs.release_version }}
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

      - name: Publish new Release
        if: inputs.release_action == 'Yeni sürümü yayınla'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.prepare.outputs.release_version }}
          target_commitish: main
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
