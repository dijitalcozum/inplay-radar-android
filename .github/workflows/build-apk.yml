name: Build Inplay Radar APK

on:
  workflow_dispatch:
    inputs:
      release_action:
        description: "Mevcut Release'i güncelle veya yeni sürüm yayınla"
        required: true
        type: choice
        default: update
        options:
          - update
          - publish
      release_version:
        description: "Sürüm numarası (ör. 2.0.0)"
        required: true
        type: string
        default: "2.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Validate release selection
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ACTION: ${{ inputs.release_action }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version format: $RELEASE_VERSION"
            exit 1
          fi

          APP_VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [[ "$RELEASE_VERSION" != "$APP_VERSION" ]]; then
            echo "Selected version ($RELEASE_VERSION) does not match app version ($APP_VERSION)."
            exit 1
          fi

          TAG="v$RELEASE_VERSION"
          if [[ "$RELEASE_ACTION" == "update" ]]; then
            gh release view "$TAG" >/dev/null
          elif [[ "$RELEASE_ACTION" == "publish" ]]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists."
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Git tag $TAG already exists."
              exit 1
            fi
          else
            echo "Unknown release action: $RELEASE_ACTION"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: |
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            sdkmanager --install "platforms;android-35" "build-tools;36.0.0"
          fi

      - name: Restore persistent signing key
        env:
          INPLAY_KEYSTORE_BASE64: ${{ secrets.INPLAY_KEYSTORE_BASE64 }}
        run: |
          echo "$INPLAY_KEYSTORE_BASE64" | base64 --decode > app/inplay-release.keystore
          test -s app/inplay-release.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build signed APK
        env:
          INPLAY_KEYSTORE_PASSWORD: ${{ secrets.INPLAY_KEYSTORE_PASSWORD }}
          INPLAY_KEY_ALIAS: ${{ secrets.INPLAY_KEY_ALIAS }}
          INPLAY_KEY_PASSWORD: ${{ secrets.INPLAY_KEY_PASSWORD }}
        run: gradle assembleDebug --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Inplay-Radar-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Update existing Release
        if: inputs.release_action == 'update'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.release_version }}
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true

      - name: Publish new Release
        if: inputs.release_action == 'publish'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.release_version }}
          target_commitish: main
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
