name: Build Inplay Radar APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: |
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -d "$ANDROID_HOME/build-tools/36.0.0" ]]; then
            sdkmanager --install "platforms;android-35" "build-tools;36.0.0"
          fi

      - name: Restore persistent signing key
        env:
          INPLAY_KEYSTORE_BASE64: ${{ secrets.INPLAY_KEYSTORE_BASE64 }}
        run: |
          echo "$INPLAY_KEYSTORE_BASE64" | base64 --decode > app/inplay-release.keystore
          test -s app/inplay-release.keystore

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.7.1'

      - name: Build signed APK
        env:
          INPLAY_KEYSTORE_PASSWORD: ${{ secrets.INPLAY_KEYSTORE_PASSWORD }}
          INPLAY_KEY_ALIAS: ${{ secrets.INPLAY_KEY_ALIAS }}
          INPLAY_KEY_PASSWORD: ${{ secrets.INPLAY_KEY_PASSWORD }}
        run: gradle assembleDebug --console=plain

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Inplay-Radar-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish or update direct APK download
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref == 'refs/heads/main' && 'v1.0.0' || github.ref_name }}
          target_commitish: main
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
